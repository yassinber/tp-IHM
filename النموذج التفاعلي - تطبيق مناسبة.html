SCR.create=(t,wide)=>{

      :amt>0?`<div class="banner info">${ic('info','s')}<span>بعد الحفظ سيصبح المتبقي <b>${money(after)} دج</b> (${Math.round((spent(e)+amt)/e.budget*100)}% مصروفة)</span></div>`:''}

/* ---------- helpers for forms ---------- */
const norm=(v,pro)=>pro?String(v||'').trim().toLowerCase():String(v||'').replace(/\D/g,'');
function changed(t){const e=ev(t.edit),d=t.dr,r=[];if(d.name!==e.name)r.push('الاسم');if(d.type!==e.type)r.push('النوع');if(d.date!==e.date)r.push('التاريخ');if(d.time!==e.time)r.push('الوقت');if(d.place!==e.place)r.push('المكان');if(String(d.budget||0)!==String(e.budget||0))r.push('الميزانية');if(d.expected!==e.expected)r.push('عدد المدعوين');return r}
function validate(t){const d=t.dr,er={};
  if(t.step===1){if(!d.type)er.type='اختر نوع الفعالية.';if(!d.name.trim())er.name='اسم الفعالية مطلوب.';if(!d.date)er.date='التاريخ مطلوب.';else if(d.date<TODAY)er.date=`هذا التاريخ مضى. اختر ${dm(TODAY)} أو بعده.`}
  if(t.step===2){if(d.budget!==''&&!/^\d+$/.test(String(d.budget).replace(/[,\s]/g,'')))er.budget='أدخل رقماً بلا رموز، مثل 60000.'}
  t.er=er;return !Object.keys(er).length}
function saveCreate(t){const d=t.dr;const budget=+String(d.budget||'0').replace(/[,\s]/g,'')||0;
  if(t.edit){const e=ev(t.edit);Object.assign(e,{type:d.type,name:d.name.trim(),date:d.date,time:d.time,place:d.place.trim(),budget,expected:d.expected});mark('edit_or_delete');S.stack.pop();S.ov=null;snack('حُفظت التعديلات');return}
  const e={id:uid(),type:d.type,name:d.name.trim(),date:d.date,time:d.time||'18:00',place:d.place.trim(),budget,expected:d.expected,closed:false,guests:[],expenses:[],
    tasks:d.services.map(s=>({id:uid(),title:(s==='قاعة'?'حجز القاعة':s==='نقل'?'تنظيم النقل':'حجز '+s),phase:'before',due:'',done:false,owner:''}))};
  S.events.push(e);mark('create');const sec=Math.max(1,Math.round((Date.now()-t.t0)/1000));
  S.stack.pop();go('event',{id:e.id,tab:'guests'});snack(`أُنشئت الفعالية في ${sec} ثانية. أضف المدعوين الآن.`)}
function archive(e){e.closed=true;e.rating=S.cd.rating;e.notes=S.cd.notes;e.attended=[...S.cd.att];mark('close');root('home');}

/* ---------- actions ---------- */
const A={
  noop(){},
  root(d){root(d.n);if(d.n==='calendar')mark('_cal')},
  back(){back()},
  undo(){const u=S.snack&&S.snack.undo;S.snack=null;if(u)u()},
  ovclose(){S.ov=null},ovx(){S.ov=null},
  open(d){go('event',{id:d.id,tab:d.tab||'overview'});mark('open')},
  opentask(d){const e=ev(d.id);const x=e.tasks.find(y=>y.id===d.tid);go('event',{id:d.id,tab:'tasks',ph:x.phase,hl:x.id});mark('open')},
  calopen(d){go('event',{id:d.id,tab:'overview'});mark('open');mark('calday')},
  caltask(d){A.opentask(d);mark('calday')},
  calsel(d){const t=top();t.sel=d.d;const x=D(d.d);t.ym=[x.getFullYear(),x.getMonth()]},
  calnav(d){const t=top();let [y,m]=t.ym;m+=+d.d;if(m<0){m=11;y--}if(m>11){m=0;y++}t.ym=[y,m];t.sel=ISO(new Date(y,m,1));t.view='month'},
  caltoday(){const t=top();t.ym=[2026,10];t.sel=TODAY},
  calview(d){top().view=d.v},
  tab(d){top().tab=d.v;top().hl=null;S.ui.gexp=null},
  create(){go('create',{step:1,dr:{type:'',name:'',date:'',time:'',place:'',budget:'',expected:15,services:[],autoRemind:true},er:{},t0:Date.now(),dirty:false});S._focus='cName'},
  edit(d){const e=ev(d.id);go('create',{step:1,edit:e.id,dr:{type:e.type,name:e.name,date:e.date,time:e.time,place:e.place,budget:e.budget?String(e.budget):'',expected:e.expected||e.guests.length,services:[],autoRemind:true},er:{},t0:Date.now(),dirty:false})},
  ctype(d){const t=top();t.dr.type=d.v;t.dirty=true;if(t.er)delete t.er.type},
  cexp(d){const t=top();t.dr.expected=Math.max(0,t.dr.expected+(+d.d));t.dirty=true},
  csvc(d){const t=top(),s=t.dr.services,i=s.indexOf(d.v);i<0?s.push(d.v):s.splice(i,1);t.dirty=true},
  cadv(){const t=top();t.adv=!t.adv},cauto(){const t=top();t.dr.autoRemind=!t.dr.autoRemind},
  cnext(){const t=top();if(validate(t)){t.step++;t.er={}}else{const f={type:null,name:'cName',date:'cDate',budget:'cBudget'}[Object.keys(t.er)[0]];if(f)S._focus=f}},
  cprev(){const t=top();t.step--;t.er={}},
  cclose(){const t=top();if(t.step>1&&!t.edit){t.step--;t.er={};return}if(t.dirty&&(!t.edit||changed(t).length))S.ov={t:'unsaved'};else S.stack.pop()},
  csave(){saveCreate(top())},
  usave(){const t=top();t.step=1;if(!validate(t)){S.ov=null;return}t.step=2;if(!validate(t)){S.ov=null;return}saveCreate(t)},
  udiscard(){S.ov=null;S.stack.pop()},
  menu(d){S.ov={t:'menu',id:d.id}},
  del(d){S.ov={t:'del',id:d.id};S._focus='delCancel'},
  delok(){const e=ev(S.ov.id);S.events=S.events.filter(x=>x!==e);S.trash.unshift(e);mark('edit_or_delete');root('home');
    snack(`حُذفت «${e.name}» ونُقلت إلى سلة المحذوفات`,()=>{S.trash=S.trash.filter(x=>x!==e);S.events.push(e)})},
  restore(d){const e=S.trash.find(x=>x.id===d.id);S.trash=S.trash.filter(x=>x!==e);S.events.push(e);snack(`استُعيدت «${e.name}»`)},
  close(d){const e=ev(d.id);S.cd={att:new Set(e.guests.filter(g=>g.status==='c').map(g=>g.id)),cert:true,thanks:true,rating:0,notes:''};go('close',{id:e.id})},
  catt(d){const s=S.cd.att;s.has(d.gid)?s.delete(d.gid):s.add(d.gid)},
  ccert(){S.cd.cert=!S.cd.cert},cthanks(){S.cd.thanks=!S.cd.thanks},
  rate(d){S.cd.rating=+d.v},
  cdoneall(){const e=ev(top().id);const was=e.tasks.filter(x=>!x.done);was.forEach(x=>x.done=true);snack(`عُلّمت ${N(was.length,'مهمة')} كمنجزة`,()=>was.forEach(x=>x.done=false))},
  cfinish(){const e=ev(top().id);if(PRO.has(e.type)&&S.cd.cert){S.ov={t:'cert'};return}archive(e);snack(`أُغلقت «${e.name}» وأُرشفت${S.cd.thanks?' · أُرسلت رسالة الشكر':''}`,()=>{e.closed=false})},
  cconfirm(){const e=ev(top().id);const n=e.guests.filter(g=>S.cd.att.has(g.id)&&g.contact.includes('@')).length;archive(e);snack(`أُرسلت ${N(n,'شهادة')} حضور وأُرشفت «${e.name}»`)},
  remind(d){const e=ev(d.id);const n=cnt(e).p;if(S.offline){snack('لا يوجد اتصال. سيُرسل التذكير عند عودة الاتصال.');return}snack(`أُرسل تذكير إلى ${N(n,'مدعو')} لم يردّوا بعد`)},
  gfilter(d){const t=top();t.f=t.f===d.v?'all':d.v},
  gexp(d){S.ui.gexp=S.ui.gexp===d.gid?null:d.gid},
  gstatus(d){const e=ev(top().id);const g=e.guests.find(x=>x.id===d.gid);const old=g.status;if(old===d.v){S.ui.gexp=null;return}g.status=d.v;S.ui.gexp=null;mark('guest_status');snack(`«${g.name}»: ${ST[d.v].l}`,()=>{g.status=old})},
  gadd(){S.ov={t:'guest',name:'',contact:'',rel:'',er:{}};S._focus='gName'},
  gsave(){gsave(false)},gforce(){gsave(true)},
  gshowdup(){const g=ev(top().id).guests.find(x=>x.id===S.ov.dup);S.ov=null;S.ui.q=g.name;top().f='all'},
  tph(d){const t=top();t.ph=d.v;t.hl=null;S.ui.qph=d.v},
  ttoggle(d){const e=ev(d.id);const x=e.tasks.find(y=>y.id===d.tid);x.done=!x.done;mark('task_status');snack(x.done?`أُنجزت «${x.title}»`:`أُعيدت «${x.title}» إلى قيد الإنجاز`,()=>{x.done=!x.done})},
  tadd(){taddNow()},
  tmenu(d){S.ov={t:'tmenu',tid:d.tid}},
  tmove(d){const x=ev(top().id).tasks.find(y=>y.id===S.ov.tid);x.phase=d.v;S.ov=null;mark('task_status');snack(`نُقلت «${x.title}» إلى مرحلة «${PH[d.v]}»`)},
  tdel(){const e=ev(top().id);const x=e.tasks.find(y=>y.id===S.ov.tid);e.tasks=e.tasks.filter(y=>y!==x);S.ov=null;snack(`حُذفت «${x.title}»`,()=>e.tasks.push(x))},
  exadd(){S.ov={t:'exp',amt:'',cat:'',desc:'',er:{}};S._focus='xAmt'},
  xcat(d){S.ov.cat=d.v;if(S.ov.er)delete S.ov.er.cat},
  xfix(){S._focus='xAmt'},
  xsave(){xsave(false)},xraise(){xsave(true)},
  clarity(){S.clarity=!S.clarity},
};
function gsave(force){const o=S.ov;const e=ev(top().id);const pro=PRO.has(e.type);const er={};const c=o.contact.trim();
  if(!o.name.trim())er.name='الاسم مطلوب.';
  if(c){if(pro&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(c))er.contact='البريد ناقص: أضف @ واسم النطاق، مثل name@mail.com';
    if(!pro&&!/^0[567]\d{8}$/.test(c.replace(/\s/g,'')))er.contact='رقم الهاتف يجب أن يتكون من 10 أرقام ويبدأ بـ 05 أو 06 أو 07.'}
  o.er=er;if(Object.keys(er).length){S._focus=er.name?'gName':'gContact';return}
  if(!force){const nm=o.name.trim(),nc=norm(c,pro);const dup=e.guests.find(g=>g.name.trim()===nm||(nc&&norm(g.contact,pro)===nc));if(dup){o.dup=dup.id;return}}
  const g={id:uid(),name:o.name.trim(),rel:o.rel.trim(),contact:pro?c:c.replace(/\s/g,''),status:'p'};e.guests.unshift(g);S.ov=null;mark('guest_add');top().f='all';S.ui.q='';
  snack(`أُضيف «${g.name}» — الحالة: معلّق. انقر على الحالة لتغييرها.`,()=>{e.guests=e.guests.filter(x=>x!==g)})}
function taddNow(){const t=top();const e=ev(t.id);const v=(S.ui.qtask||'').trim();if(!v){S._focus='qTask';return}
  const ph=S.ui.qph||t.ph||'before';const x={id:uid(),title:v,phase:ph,due:'',done:false,owner:''};e.tasks.push(x);S.ui.qtask='';t.ph=ph;t.hl=x.id;mark('task_add');S._focus='qTask';
  snack(`أُضيفت «${v}» إلى مرحلة «${PH[ph]}»`,()=>{e.tasks=e.tasks.filter(y=>y!==x)})}
function xsave(raise){const o=S.ov;const e=ev(top().id);const er={};const amt=+o.amt||0;
  if(!amt)er.amt='أدخل المبلغ بالدينار.';if(!o.cat)er.cat='اختر فئة النفقة.';o.er=er;if(Object.keys(er).length){if(er.amt)S._focus='xAmt';return}
  const oldB=e.budget;if(raise)e.budget=spent(e)+amt;
  const x={id:uid(),label:o.desc.trim()||o.cat,cat:o.cat,amount:amt,date:TODAY,pending:S.offline};e.expenses.push(x);S.ov=null;S.ui.lastEx=x.id;mark('expense');
  const rem=e.budget-spent(e);
  snack(`${S.offline?'حُفظت على الجهاز':'حُفظت النفقة'} · ${rem>=0?'المتبقي '+money(rem):'تجاوز بـ '+money(-rem)} دج`,()=>{e.expenses=e.expenses.filter(y=>y!==x);e.budget=oldB})}

/* ---------- inputs ---------- */
const IN={
  q(v){S.ui.q=v;render()},
  'c.name'(v){const t=top();t.dr.name=v;t.dirty=true},
  'c.date'(v){const t=top();t.dr.date=v;t.dirty=true},
  'c.time'(v){const t=top();t.dr.time=v;t.dirty=true},
  'c.place'(v){const t=top();t.dr.place=v;t.dirty=true},
  'c.budget'(v){const t=top();t.dr.budget=v.replace(/[^\d]/g,'');t.dirty=true},
  qtask(v){S.ui.qtask=v},qph(v){S.ui.qph=v},
  cnotes(v){S.cd.notes=v},
  xamt(v,el){const digits=v.replace(/[^\d٠-٩]/g,'').replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c));S.ov.amt=digits.slice(0,9);if(S.ov.er)delete S.ov.er.amt;render();const i=$('#xAmt');if(i){i.focus();const L=i.value.length;i.setSelectionRange(L,L)}},
  xdesc(v){S.ov.desc=v},
  gname(v){S.ov.name=v;S.ov.dup=null},gcontact(v){S.ov.contact=v;S.ov.dup=null},grel(v){S.ov.rel=v},
};
document.addEventListener('click',ev_=>{const el=ev_.target.closest('[data-a]');if(!el||!$('#page').contains(el))return;const a=el.dataset.a;
  if(a==='ovclose'&&ev_.target!==el)return;if(el.disabled)return;if(!A[a]&&!P[a])return;ev_.preventDefault();(A[a]||P[a])(el.dataset,el);render()});
document.addEventListener('input',e=>{const el=e.target;const k=el.dataset&&el.dataset.in;if(k&&IN[k])IN[k](el.value,el)});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='cDate'||el.id==='qPh')render()});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='qTask'){e.preventDefault();taddNow();render();return}
  if(e.key==='Escape'&&S.ov){S.ov=null;render();return}
  const tk=e.target.closest&&e.target.closest('.tk');
  if(tk&&e.altKey&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){e.preventDefault();const order=['before','during','after'];const x=ev(top().id).tasks.find(y=>y.id===tk.dataset.tid);
    let i=order.indexOf(x.phase)+(e.key==='ArrowLeft'?1:-1);i=Math.max(0,Math.min(2,i));if(order[i]!==x.phase){x.phase=order[i];mark('task_status');snack(`نُقلت «${x.title}» إلى مرحلة «${PH[x.phase]}»`)}top().hl=x.id;render();const n=document.querySelector(`.tk[data-tid="${x.id}"]`);if(n)n.focus();return}
  if(tk&&e.key==='Enter'&&e.target===tk){const cb=tk.querySelector('.cb');if(cb)cb.click()}
  if(e.target.matches&&e.target.matches('tr[data-a]')&&e.key==='Enter'){e.target.click()}
});
let dragId=null;
document.addEventListener('dragstart',e=>{const tk=e.target.closest&&e.target.closest('.tk');if(!tk)return;dragId=tk.dataset.tid;e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',dragId)}catch(_){}});
document.addEventListener('dragover',e=>{const c=e.target.closest&&e.target.closest('[data-drop]');if(!c||!dragId)return;e.preventDefault();document.querySelectorAll('.col.over').forEach(x=>x!==c&&x.classList.remove('over'));c.classList.add('over')});
document.addEventListener('drop',e=>{const c=e.target.closest&&e.target.closest('[data-drop]');if(!c||!dragId)return;e.preventDefault();const x=ev(top().id).tasks.find(y=>y.id===dragId);const from=x.phase;
  if(from!==c.dataset.drop){x.phase=c.dataset.drop;mark('task_status');snack(`نُقلت «${x.title}» إلى مرحلة «${PH[x.phase]}»`,()=>{x.phase=from})}top().hl=x.id;dragId=null;render()});
document.addEventListener('dragend',()=>{dragId=null;document.querySelectorAll('.col.over').forEach(x=>x.classList.remove('over'))});

/* ---------- bench panel ---------- */
const PATHS=[['الانتقال من لوحة التحكم إلى إنشاء فعالية',['create']],['فتح تفاصيل فعالية موجودة',['open']],['اختيار يوم في التقويم والوصول إلى الفعالية المرتبطة به',['calday']],['إضافة مدعو وتغيير حالة الدعوة',['guest_add','guest_status']],['إضافة مهمة وتحديث حالة إنجازها',['task_add','task_status']],['تسجيل نفقة وعرض أثرها على الميزانية',['expense']],['تعديل فعالية أو طلب تأكيد حذفها',['edit_or_delete']],['إغلاق فعالية وإرسال شهادات الحضور',['close']]];
const SCEN={sara:['أنشئي فعالية «عيد ميلاد» من زر + (هدف: أقل من 60 ثانية).','افتحي «قائمة المدعوين» وأضيفي مدعواً.','انقري على حالة دعوة «معلّق» وغيّريها إلى «مؤكَّد».','حدّثي الحضور، ثم سجّلي نفقة من تبويب «الميزانية» وتحققي من المتبقي.'],
  amin:['أنشئ فعالية من نوع «ندوة» من «فعالية جديدة».','افتح «ندوة التحول الرقمي 2027» ← «المهام» واسحب مهمة بين المراحل.','تابع المواعيد النهائية في «التقويم» (يوم 12 أو 18 نوفمبر).','أغلق الندوة من «⋮ ← إغلاق الفعالية» وأرسل شهادات الحضور.']};
const P={
  persona(d){reset(d.v,d.v==='amin');},
  device(d){S.wide=d.v==='wide'},
  offline(){S.offline=!S.offline;if(!S.offline){let n=0;S.events.forEach(e=>e.expenses.forEach(x=>{if(x.pending){x.pending=false;n++}}));if(n)snack(`عاد الاتصال · تمت مزامنة ${N(n,'نفقة')}`)}},
  pclarity(){S.clarity=!S.clarity},
  resetall(){reset(S.persona,S.wide)},
};
function panel(){
  const done=PATHS.filter(([,k])=>k.every(x=>S.paths[x])).length;
  $('#panel').innerHTML=`<div><h1>مُناسَبة · النموذج التفاعلي</h1><p>نموذج أولي قابل للنقر لتطبيق إدارة الفعاليات. البيانات أمثلة، وكل التعديلات تبقى داخل هذه الصفحة.</p></div>
  <div class="pbox"><h2>الشخصية</h2><div class="switch" role="group" aria-label="الشخصية"><button data-a="persona" data-v="sara" aria-pressed="${S.persona==='sara'}">سارة · هاتف</button><button data-a="persona" data-v="amin" aria-pressed="${S.persona==='amin'}">أمين · حاسوب</button></div>
    ${narrow()?'':`<h2>الجهاز</h2><div class="switch" role="group" aria-label="الجهاز"><button data-a="device" data-v="phone" aria-pressed="${!S.wide}">هاتف</button><button data-a="device" data-v="wide" aria-pressed="${S.wide}">حاسوب</button></div>`}
    <div class="trow"><span>وضع الوضوح (إمكانية الوصول)</span><button class="toggle" role="switch" aria-checked="${S.clarity}" data-a="pclarity" aria-label="وضع الوضوح"></button></div>
    <div class="trow"><span>محاكاة انقطاع الاتصال</span><button class="toggle" role="switch" aria-checked="${S.offline}" data-a="offline" aria-label="محاكاة انقطاع الاتصال"></button></div></div>
  <div class="pbox"><div class="trow"><h2>مسارات الاختبار (النشاط 3.3)</h2><span class="prog">${done}/8</span></div><ul class="plist">${PATHS.map(([l,k],i)=>{const n=k.filter(x=>S.paths[x]).length;const st=n===k.length?'done':n?'half':'';return `<li><span class="pdot ${st}">${st==='done'?'✓':i+1}</span><span>${l}</span></li>`}).join('')}</ul><p style="font-size:12px">تُعلَّم المسارات تلقائياً عند تنفيذها داخل النموذج.</p></div>
  <div class="pbox"><h2>سيناريو ${S.persona==='sara'?'سارة':'أمين'} (النشاط 3.4)</h2><ol class="steps">${SCEN[S.persona].map(s=>`<li>${s}</li>`).join('')}</ol><div class="trow"><span style="font-size:12px;color:var(--muted)">اليوم في النموذج: الثلاثاء 10/11/2026</span><button class="lnkbtn" data-a="resetall">إعادة البيانات</button></div></div>`;
}
window.addEventListener('resize',()=>render());
render();
})();
</script>

</body>
</html>
